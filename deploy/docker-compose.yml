# Produktion (Phase 1, Eigenbetrieb): fertiges Image aus der GitHub Container Registry, hinter Traefik.
#
#   cp deploy/.env.example deploy/.env   # Werte eintragen (POSTGRES_PASSWORD, DOMAIN)
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env --profile backup up -d   # zusätzlich tägliches pg_dump
#
# Voraussetzung: Traefik läuft bereits mit dem externen Docker-Netz "proxy", den Entrypoints http/https
# und dem Certresolver "http" (wie bei den übrigen Diensten). Die App veröffentlicht keine Ports selbst.
#
# Update: IMAGE_TAG in deploy/.env ändern, dann `pull` und `up -d`. Migrationen laufen beim Start.
services:
  # Optional: automatische Updates, sobald ein neues Image mit dem gewählten Tag in der Registry liegt
  #   docker compose -f deploy/docker-compose.yml --env-file deploy/.env --profile autoupdate up -d
  # Prüft alle 5 Minuten; aktualisiert nur Container mit dem Label com.centurylinklabs.watchtower.enable=true (nur die App, nicht die Datenbank).
  # containrrr/watchtower ist seit 12/2025 archiviert (keine Sicherheitsupdates): gepflegter Fork, per Digest gepinnt, da er den Docker-Socket hält.
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:1.21.2@sha256:3b8d2e3f0f6ff9295a5d634e4fdb7062e5e6602f71d89baa15cd4d39d22b5743
    container_name: projekttool-watchtower
    restart: unless-stopped
    profiles: ["autoupdate"]
    command: --interval 300 --cleanup --label-enable
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal

  db:
    image: postgres:16-alpine
    container_name: projekttool-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: projekttool
      POSTGRES_USER: projekttool
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projekttool -d projekttool"]
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    image: ${IMAGE:-ghcr.io/phat-shot/project}:${IMAGE_TAG:-latest}
    container_name: projekttool
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://projekttool:${POSTGRES_PASSWORD}@db:5432/projekttool
      PORT: "3000"
      DATA_DIR: /data
      SEED: ${SEED:-false}
      SYNC_INTERVAL_MS: ${SYNC_INTERVAL_MS:-60000}
      COOKIE_SECURE: "true"
      PUBLIC_URL: https://${DOMAIN:?DOMAIN fehlt in deploy/.env}
      LOG: "true"
      # Client-Adresse aus X-Forwarded-For übernehmen, wenn die Anfrage aus einem privaten Netz (Traefik im Docker-Netz) kommt
      TRUST_PROXY: ${TRUST_PROXY:-loopback,linklocal,uniquelocal}
      # Interne Ziele für CalDAV, IMAP/SMTP, eigene LLMs freigeben (Hostnamen oder CIDR, kommagetrennt)
      OUTBOUND_ALLOW_HOSTS: ${OUTBOUND_ALLOW_HOSTS:-}
      # Schlüssel für gespeicherte Geheimnisse (Mail-Passwörter, OAuth-Tokens, KI-Schlüssel); leer = Datei /data/secret.key
      SECRET_KEY: ${SECRET_KEY:-}
    volumes:
      - appdata:/data
    networks:
      - proxy
      - internal
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.projekttool.entrypoints=http"
      - "traefik.http.routers.projekttool.rule=Host(`${DOMAIN}`)"
      - "traefik.http.middlewares.projekttool-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.projekttool.middlewares=projekttool-https-redirect"
      - "traefik.http.routers.projekttool-secure.entrypoints=https"
      - "traefik.http.routers.projekttool-secure.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.projekttool-secure.tls=true"
      - "traefik.http.routers.projekttool-secure.tls.certresolver=http"
      - "traefik.http.routers.projekttool-secure.service=projekttool"
      - "traefik.http.services.projekttool.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy"

  # Tägliches Backup der Datenbank nach ./backups (pg_dump, 14 Tage Aufbewahrung)
  backup:
    image: postgres:16-alpine
    container_name: projekttool-backup
    profiles: ["backup"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    networks:
      - internal
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump -h db -U projekttool -d projekttool -Fc -f /backups/projekttool-$(date +%F).dump && \
          find /backups -name 'projekttool-*.dump' -mtime +14 -delete
          sleep 86400
        done

networks:
  proxy:
    external: true
  internal:

volumes:
  pgdata:
  appdata:
