name: Android APK

# Baut die Android-App (Capacitor-Hülle um die Server-Instanz) als Debug-APK, optional signiert als Release-APK.
# Läuft manuell (Actions → Android APK → Run workflow, optional mit anderer Server-Adresse), bei Git-Tags v* (APKs hängen am Release)
# und bei Änderungen unter apps/mobile; der Pfadfilter gilt nicht für Tags.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Server-Adresse, die die App lädt
        required: false
        default: https://project.srz.one
  push:
    tags: ['v*.*.*']
    branches: [main]
    paths: ['apps/mobile/**', '.github/workflows/android.yml']

jobs:
  apk:
    name: APK bauen
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      APP_URL: ${{ github.event.inputs.url || 'https://project.srz.one' }}
      # Step-eigenes env ist im if desselben Steps nicht sichtbar: Vorhandensein des Keystores auf Job-Ebene prüfen
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Abhängigkeiten
        run: npm ci --no-audit --no-fund

      - name: Server-Adresse eintragen
        working-directory: apps/mobile
        run: |
          jq --arg url "$APP_URL" '.server.url = $url' capacitor.config.json > cfg.tmp && mv cfg.tmp capacitor.config.json
          cat capacitor.config.json

      - name: Android-Projekt erzeugen und synchronisieren
        working-directory: apps/mobile
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Version aus Git setzen
        working-directory: apps/mobile/android
        run: |
          CODE=$(git rev-list --count HEAD)
          case "$GITHUB_REF" in refs/tags/v*) NAME="${GITHUB_REF_NAME#v}" ;; *) NAME="0.1.0-$(git rev-parse --short HEAD)" ;; esac
          sed -i "s/versionCode [0-9]*/versionCode ${CODE}/; s/versionName \"[^\"]*\"/versionName \"${NAME}\"/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle

      - name: Debug-APK bauen
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../PROject-debug.apk

      - name: Release-APK bauen (nur mit Keystore-Secrets)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$PWD/release.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          cp app/build/outputs/apk/release/app-release.apk ../PROject-release.apk
          rm -f release.jks

      - name: Debug-APK als Artefakt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PROject-debug-apk
          path: apps/mobile/PROject-debug.apk
          retention-days: 30

      - name: Release-APK als Artefakt
        if: ${{ hashFiles('apps/mobile/PROject-release.apk') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PROject-release-apk
          path: apps/mobile/PROject-release.apk
          retention-days: 90

      # Nur die signierte Release-APK geht ans öffentliche Release; die Debug-APK (debuggable) bleibt Workflow-Artefakt
      - name: Release-APK an das Release hängen
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('apps/mobile/PROject-release.apk') != ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: apps/mobile/PROject-release.apk
