name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Produktionsabhängigkeiten auf bekannte Schwachstellen prüfen (hoch/kritisch; Build-Werkzeuge ausgenommen)
        run: npm audit --audit-level=high --omit=dev
      - run: npm run typecheck
      - name: API- und Web-Tests (PGlite im Speicher, Vitest)
        run: npm test
      - run: npm run build
      - name: Build-Artefakte prüfen
        run: test -f apps/api/dist/server.js && test -f apps/web/dist/index.html

  e2e:
    name: E2E-Smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: App mit Demodaten starten
        run: |
          SEED=true DATABASE_URL=memory PORT=3000 LOG=false PUBLIC_URL=http://localhost:3000 node apps/api/dist/server.js &
          for i in $(seq 1 40); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
      - run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
