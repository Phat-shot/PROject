name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Typecheck, Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: API-Tests (PGlite im Speicher)
        run: npm test
      - run: npm run build
      - name: Build-Artefakte prüfen
        run: test -f apps/api/dist/server.js && test -f apps/web/dist/index.html
