name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Typecheck, Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: API- und Web-Tests (PGlite im Speicher, Vitest)
        run: npm test
      - run: npm run build
      - name: Build-Artefakte prüfen
        run: test -f apps/api/dist/server.js && test -f apps/web/dist/index.html

  e2e:
    name: E2E-Smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: App mit Demodaten starten
        run: |
          SEED=true DATABASE_URL=memory PORT=3000 LOG=false PUBLIC_URL=http://localhost:3000 node apps/api/dist/server.js &
          for i in $(seq 1 40); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
